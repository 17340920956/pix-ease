worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream web-prod {
        server pix-ease-web-prod:80;
    }

    upstream web-qa {
        server pix-ease-web-qa:80;
    }

    upstream admin-prod {
        server pix-ease-admin-prod:80;
    }

    upstream admin-qa {
        server pix-ease-admin-qa:80;
    }

    upstream backend-prod {
        server pix-ease-backend-prod:8080;
    }

    upstream backend-qa {
        server pix-ease-backend-qa:8080;
    }

    server {
        listen 80;
        server_name yxbot.online;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name yxbot.online;

        ssl_certificate     /etc/nginx/ssl/yxbot.online.pem;
        ssl_certificate_key /etc/nginx/ssl/yxbot.online.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Sign, X-Timestamp, X-Nonce";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            proxy_pass http://backend-prod/api/;
        }

        location /qa/api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Sign, X-Timestamp, X-Nonce";
                add_header Access-Control-Allow-Credentials "true";
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            proxy_pass http://backend-qa/api/;
        }

        location /qa/admin {
            proxy_pass http://admin-qa/;
        }

        location /qa/ {
            proxy_pass http://web-qa/;
        }

        location /admin {
            proxy_pass http://admin-prod/;
        }

        location / {
            proxy_pass http://web-prod/;
        }
    }
}